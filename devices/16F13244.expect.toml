# Numbers read BY HAND from the PIC16F13214/15/24/25/44/45 data sheet (DS40002686B), used by `devgen check` to
# cross-check the description generated from the Microchip pack. Do not generate this file.
# Program memory, user IDs and configuration are counted in 14-bit WORDS for this family (one address per
# word), not bytes as on PIC18.

[source]
datasheet = "DS40002686B"
reference = "Table 1 (p.1), Table 9-1 (p.41), Fig. 9-1 (p.42), Sec. 8.1/8.3/8.4 (p.23-25), Table 15-2 (p.171)"

[memory]
program_bytes = 4096     # 4096 words, Table 9-1 p.41
sram_bytes    = 512      # data SRAM (Table 1, p.1: 512 bytes)
eeprom_bytes  = 256       # 256 bytes data EEPROM at F000h-F0FFh (Table 1 p.1; Table 9-2 p.45; Table 15-2 p.171)
hw_stack_levels = 16      # stack levels 0-15 (Fig. 9-1 p.42; Core Features p.2)
config_bytes  = 7         # Configuration Words 1-7 at 8007h-800Dh (Sec. 8.1 p.23, Sec. 8.5.1-8.5.7 p.26-36); Table 15-2 p.171 says "1-5, 8007-800B": the data sheet disagrees with itself, the pack and the register chapters agree on 7
user_id_bytes = 4         # 4 user ID words, 8000h-8003h (Sec. 8.3, p.25)

[vectors]
reset          = 0        # 0000h  (Sec. 9.1, p.41)
interrupt_high = 4        # 0004h  (single interrupt vector)
interrupt_low  = 4        # same vector

# Peripheral counts from Table 1 (p.1) and the pin allocation tables (Sec. 3, p.12ff), checked by counting SFRs whose name matches the pattern.
[counts]
"TX#STA"    = 2   # EUSART                   (Core features p.4: two EUSART; TX1/TX2 in Table 3-1)
"SSP#CON1"  = 1   # I2C/SPI (MSSP)           (Table 3-1: SCL1/SDA1 only; the family has up to two, this data sheet's parts one)
"CCP#CON"   = 2   # CCP                      (Table 1: CCP 2)
"PWM#CON"   = 2   # 16-bit dual PWM          (Table 1: PWM 2)
"CM#CON0"   = 2   # comparators              (Table 1: CMP 2)
