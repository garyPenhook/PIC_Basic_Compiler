# Numbers read BY HAND from the PIC16F18056/76 data sheet DS40002325C (PIC16F18076, 40-pin), used by `devgen check` to
# cross-check the description generated from the Microchip pack. Do not generate this file.
# Program memory, user IDs and configuration are counted in 14-bit WORDS for this family (one address per
# word), not bytes as on PIC18.
# Device ID read from the data sheet (Register 8.7.1 p.33): 3100h (12544); the description must carry 12544.

[source]
datasheet = "DS40002325C"
reference = "Table 1 (p.1), Table 9-1 (p.35), Device Configuration (p.25), DEVICEID (p.33), 9.5 stack (p.51), Table 15-2 (p.122)"

[memory]
program_bytes = 16384     # 16K words (28 KB) program flash  (Table 1 p.1; Table 9-1 p.35: 0000h-3FFFh)
sram_bytes    = 2048      # data SRAM                         (Table 1, p.1)
eeprom_bytes  = 256       # data flash (EEPROM), F000h-F0FFh  (Table 1, p.1; Table 15-2 p.122)
hw_stack_levels = 16      # 16-level hardware stack           (9.5, p.51)
config_bytes  = 5         # 5 configuration words, 8007h-800Bh (Sec. 8.1, p.25)
user_id_bytes = 4         # 4 user ID words, 8000h-8003h       (Sec. 8.4, p.25)

[vectors]
reset          = 0        # 0000h  (Sec. 9.1, p.35)
interrupt_high = 4        # 0004h  (single interrupt vector)
interrupt_low  = 4        # same vector

# Peripheral counts from Table 1 (p.1), checked by counting SFRs whose name matches the pattern.
[counts]
"TX#STA"    = 2   # EUSART                   (Table 1: EUSART 2)
"SSP#CON1"  = 2   # I2C/SPI (MSSP)           (Table 1: I2C/SPI 2/2)
"CCP#CON"   = 2   # CCP                      (Table 1: 10-bit PWM/CCP 3/2)
"PWM#CON"   = 3   # 10-bit PWM               (Table 1: 10-bit PWM/CCP 3/2)
"CM#CON0"   = 1   # comparator               (Table 1: CMP 1)
"CWG#CON0"  = 1   # complementary waveform generator (Table 1: CWG 1)
