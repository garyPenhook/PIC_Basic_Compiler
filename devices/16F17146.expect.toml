# Numbers read BY HAND from the PIC16F17126/46 data sheet, used by `devgen check` to cross-check the
# description generated from the Microchip pack. Do not generate this file.
# Program memory, user IDs and configuration are counted in 14-bit WORDS for this family (one address per
# word), not bytes as on PIC18.

[source]
datasheet = "DS40002343F"
reference = "Table 1 (p.1), Table 9-1 and Fig. 9-1 (p.36-37), Device Configuration (p.24)"

[memory]
program_bytes = 16384     # 16K words (28 KB) program flash  (Table 1 p.1; Table 9-1 p.36: 0000h-3FFFh)
sram_bytes    = 2048      # data SRAM                         (Table 1, p.1)
eeprom_bytes  = 256       # data EEPROM                       (Table 1, p.1)
config_bytes  = 5         # 5 configuration words, 8007h-800Bh (Sec. 8.1, p.24)
user_id_bytes = 4         # 4 user ID words, 8000h-8003h       (Sec. 8.4, p.24)

[vectors]
reset          = 0        # 0000h  (Sec. 9.1 p.36, Fig. 9-1 p.37)
interrupt_high = 4        # 0004h  (single interrupt vector)
interrupt_low  = 4        # same vector

# Peripheral counts from Table 1 (p.1), checked by counting SFRs whose name matches the pattern.
[counts]
"TX#STA"    = 2   # EUSART                   (Table 1: EUSART 2)
"SSP#CON1"  = 2   # I2C/SPI (MSSP)           (Table 1: I2C/SPI 2)
"CCP#CON"   = 2   # CCP                      (Table 1: CCP 2)
"PWM#CON"   = 2   # 16-bit PWM               (Table 1: PWM 2)
"CM#CON0"   = 2   # comparators              (Table 1: CMP 2)
"CWG#CON0"  = 1   # complementary waveform generator (Table 1: CWG 1)
