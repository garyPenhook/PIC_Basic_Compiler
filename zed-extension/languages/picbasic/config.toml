name = "PIC BASIC"
grammar = "picbasic"
path_suffixes = ["bas"]
line_comments = ["' "]
block_comment = { start = "(* ", prefix = "", end = " *)", tab_size = 0 }
autoclose_before = ";:.,=}])>"
brackets = [
  { start = "(", end = ")", close = true, newline = false },
  { start = "\"", end = "\"", close = true, newline = false, not_in = ["string", "comment"] },
  { start = "(*", end = "*)", close = true, newline = false, not_in = ["string", "comment"] },
]
tab_size = 4
hard_tabs = false
word_characters = ["_"]
